name: Checks

# Typecheck, build and the browser tests, on every pull request and as the
# first job of every deploy (deploy.yml calls this workflow), so the same
# gate guards both doors.
#
# The browser tests (e2e/) run the PRODUCTION build against a fake API that
# answers what the crawler really answers, report shapes included: no
# Sellers.json page, no Schain, nothing discovered, trial, signed out,
# expired, an older API. On 2026-10-06 a 404 from /sellers-fix took every
# report without that page down; these tests fail on that code.

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # A newer push to a PR replaces the older run; a deploy's run is never cut.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: typecheck, build, browser tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    # Browser/dependency installation can consume most of 15 minutes on a
    # cold runner. Leave time for the full suite; do not skip any checks.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app itself (npm run build, mock
      # off) and serves it with vite preview before the tests start.
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          CI: "true"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-gate:
    name: typecheck, build, browser tests
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      # Preserve the existing required-check name. A failed, cancelled or
      # skipped matrix must never turn into a successful aggregate gate.
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.checks.result }}
        run: test "$SHARDS_RESULT" = success
