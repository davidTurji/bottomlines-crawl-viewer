name: Deploy demo

# Ships the PUBLIC PATH FINDER DEMO from the `demo` branch, and only from
# the `demo` branch.
#
# THE DEMO IS NOT MAIN, AND MUST NOT BE
#
# This branch carries UI the customer viewer has not shipped: the Ask AI
# panel and its question carousel, a contact button, a fixture rewritten for
# a fictional customer. None of that belongs in a live customer's weekly
# report until it is decided on its own merits, and merging the demo into
# main to deploy it would have redeployed the customer viewer as a side
# effect of publishing a sales page. So the demo ships from here.
#
# The branch is therefore deliberately AHEAD of main, not a copy of it.
# Keeping it current means merging main INTO demo, never the other way.
#
# WHAT IT DEPLOYS
#
# The same SPA, built with `--mode demo` so every api.* call short-circuits
# to the fixture in src/lib/mockData.ts. No API, no database, no sign-in, no
# customer data: the report is one week in the life of an invented customer,
# Made Up Media. That is what makes it safe to leave publicly reachable
# forever, and it costs nothing at rest because Cloud Run scales it to zero.
#
# Its own Cloud Run service, `bl-crawl-viewer-demo`. Nothing it serves can
# reach a customer's report, because the image has no backend wired to it at
# all: CRAWLER_API_URL is deliberately left unset, so the nginx /api/ proxy
# answers 502 rather than reaching anything real.
#
# WHY IT BUILDS BY IMAGE AND THE VIEWER BUILDS BY SOURCE
#
# `gcloud run deploy --source` cannot pass a Docker build argument, and
# BUILD_MODE=demo is the single difference between the two images. So the
# demo goes through cloudbuild.demo.yaml and deploys the image it produced.
#
# Auth is the same keyless Workload Identity Federation the viewer uses.
#
# Required GitHub secrets (identical to deploy.yml, nothing new):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_SA_EMAIL

on:
  push:
    branches: [demo]
  workflow_dispatch:

concurrency:
  # Its own group, so a demo build never cancels or queues behind a
  # customer-viewer deploy. They ship from the same commit but they are
  # not the same risk.
  group: deploy-viewer-demo-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVICE: bl-crawl-viewer-demo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Fail here, in a minute, rather than inside Cloud Build after a
      # source upload with the error buried in build logs. Same reasoning
      # as the viewer's workflow, and it builds in DEMO mode so a fixture
      # that no longer typechecks against the API types is caught before
      # anything is published.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:demo

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Build the demo image
        run: |
          gcloud builds submit \
            --config cloudbuild.demo.yaml \
            --region="${{ secrets.GCP_REGION }}" \
            --substitutions=_TAG="${GITHUB_SHA::12}",_REGION="${{ secrets.GCP_REGION }}" \
            --quiet

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/$SERVICE:${GITHUB_SHA::12}"
          # --allow-unauthenticated is the feature, not an oversight: the
          # demo is meant to be opened by anyone with the link, and there
          # is nothing behind it but the fixture.
          #
          # No CRAWLER_API_URL. The demo makes no /api calls at all, so
          # leaving the upstream unset is the honest configuration: if a
          # future edit ever reintroduced a live fetch, it would fail
          # loudly against a dead port instead of quietly reaching a real
          # backend from a public page.
          #
          # EVERY LIMIT BELOW IS SET HERE ON PURPOSE. They were applied by
          # hand once and a later deploy would have silently reset them,
          # because a deploy that omits a flag takes the command's default,
          # not the value someone set in the console. Cost and blast radius
          # are not things to keep in a human's memory.
          #
          #   --service-account   a dedicated identity holding NO roles. The
          #                       default compute SA carries cloudsql.editor
          #                       and run.admin, which is not an identity to
          #                       attach to a public unauthenticated service.
          #   --max-instances=2   the hard ceiling on what a flood can ever
          #                       cost, and the headroom for several real
          #                       people reading at once. This is the cost
          #                       control; the nginx rate limit is not.
          #   --min-instances=0   nothing runs, and nothing is billed, when
          #                       nobody is looking at it.
          #   --memory=256Mi      nginx serving static files; 512 was double
          #                       what it uses.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region="${{ secrets.GCP_REGION }}" \
            --allow-unauthenticated \
            --port=8080 \
            --service-account="bl-viewer-demo-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --cpu=1 --memory=256Mi --concurrency=300 \
            --min-instances=0 --max-instances=2 \
            --quiet

      - name: Smoke-test the deployed revision
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --region="${{ secrets.GCP_REGION }}" \
            --format='value(status.url)')
          echo "-- demo deployed at $URL"
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/")
            echo "   attempt $attempt: GET $URL/ -> $code"
            if [ "$code" = "200" ]; then
              echo "revision is serving"
              exit 0
            fi
            sleep 6
          done
          echo "demo did not serve after 5 attempts"
          exit 1
