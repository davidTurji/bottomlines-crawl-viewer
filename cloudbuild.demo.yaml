# Build the PUBLIC DEMO image.
#
# The customer viewer deploys with a plain `gcloud run deploy --source .`,
# which reads the Dockerfile and needs nothing else. The demo cannot use
# that path: it differs from the viewer by one Docker build argument
# (BUILD_MODE=demo), and a source deploy has no way to pass one. So the
# demo builds here and deploys by image.
#
# Same Dockerfile, same repo, same commit as the viewer. The ONLY difference
# between the two images is which Vite mode built the bundle, which is what
# keeps the demo honest: it is the real product with fixture data behind it,
# not a separate page that has to be kept looking like the product.

substitutions:
  # Overridden by the workflow with the commit sha, so a revision can always
  # be traced back to the source that built it.
  _TAG: latest
  _REPO: cloud-run-source-deploy
  _IMAGE: bl-crawl-viewer-demo
  # Defaulted so `gcloud builds submit --config cloudbuild.demo.yaml` works
  # by hand; the workflow passes the deployment's real region over the top.
  _REGION: us-central1

steps:
  - id: build
    name: gcr.io/cloud-builders/docker@sha256:91eaff0806a70dc0b3c853191a2da9995b2aa88d9b24196182344a4cef633603
    args:
      - build
      - --build-arg
      - BUILD_MODE=demo
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:${_TAG}

options:
  logging: CLOUD_LOGGING_ONLY
