<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable lock the report against zoom on Android.
         iOS Safari ignores both by design, so src/lib/viewportLock.ts blocks
         WebKit's gesture events too, and index.css keeps inputs at 16px so
         Safari never force-zooms a focused field. All three are needed. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/images/favicon.png" />
    <!-- PathFinder is the product the customer bought. "Crawl"/"crawler"
         is the internal machinery that produces the report and must not
         appear in anything a customer reads; this tab title was the one
         place it still did. -->
    <title>PathFinder, weekly report</title>
    <meta name="description" content="Your weekly ads.txt and app-ads.txt report." />
    <!-- Link preview (WhatsApp, Slack, iMessage...). These crawlers never
         run JavaScript, so the tags live here in the shell nginx serves for
         every report URL, /crawl-report/{token} and /{slug}/{short_id}
         alike. Same text and image for every customer: nothing from a
         report ever reaches a preview.
         The image sits under /assets/, which nginx caches as immutable for a
         year, and WhatsApp caches previews by image URL: a new image is a
         new file name (bump -v1), never an overwrite. Keep it under 300 KB
         or WhatsApp shows no image at all. e2e/linkPreview.spec.ts pins all
         of this. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pathfinder | Your weekly report" />
    <meta
      property="og:description"
      content="Your latest inventory insights, changes, and discoveries."
    />
    <meta
      property="og:image"
      content="https://pathfinder.bottomlines.ai/assets/images/link-preview-weekly-report-v1.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
